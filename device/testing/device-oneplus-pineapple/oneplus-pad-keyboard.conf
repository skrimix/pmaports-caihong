# OnePlus Pad Pro Keyboard (22d9:3869), over pogo and BLE.
# Hold Search for F1-F12 on the top row and Home/End/PgUp/PgDn on the arrows;
# Tap for Search. Key names are after the hwdb remaps.

[ids]
# k: also matches the touchpads (ID_KEY set). Exclude them by hash (touchpad
# hashes are less likely to be affected by remaps and such) before matching
# the device ID. If the touchpad acts like a touchscreen while keyd runs, its
# hash changed. Only the Pad Pro ones were seen, the others are guessed by names.
# Pogo hash then BLE
# OPPO Pad 3 Pro Keyboard
-22d9:3869:04e898a9
-22d9:3869:432160ea
# OnePlus Pad Pro Keyboard
-22d9:3869:9126ca7e
-22d9:3869:96789adf
# OnePlus Pad Smart Keyboard
-22d9:3869:d54bd474
-22d9:3869:76534115
k:22d9:3869

[main]
search = overload(fn, search)

[fn]
brightnessdown = f1
brightnessup = f2
micmute = f3
# Touchpad toggle: F16 (off) / F17 (on) on firmware 1.5.7, F22 on 1.5.2.
# Only patched firmware skips the toggle itself while Search is held.
f16 = f4
f17 = f4
f22 = f4
sysrq = f5
# KEY_SCREENLOCK
coffee = f6
previoussong = f7
playpause = f8
nextsong = f9
mute = f10
volumedown = f11
volumeup = f12
left = home
right = end
up = pageup
down = pagedown
