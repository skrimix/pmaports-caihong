# Hand the boot splash to the compositor like GDM does. Quitting Plymouth
# before the login manager closes the last DRM file, which restores the
# text console until kwin starts.
[Unit]
Conflicts=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/libexec/caihong-plymouth-handover
