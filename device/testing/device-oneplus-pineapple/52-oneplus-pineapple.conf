monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "OnePlus-Pad-2" }
    ]
    actions = {
      update-props = {
        # -30 dB, matching the validated Speaker Playback Volume value 60.
        # WirePlumber restores the user's saved volume on subsequent starts.
        device.routes.default-sink-volume = 0.0316227766
      }
    }
  }
]
